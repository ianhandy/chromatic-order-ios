name: ChromaticOrder
options:
  bundleIdPrefix: com.ianhandy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Apple Developer team (Ian Handy). Kept here so xcodegen preserves
    # it across regenerations — without this it gets reset and archives
    # fail with "Signing requires a development team."
    DEVELOPMENT_TEAM: X5BKD97T2F
    CODE_SIGN_STYLE: Automatic
targets:
  ChromaticOrder:
    type: application
    platform: iOS
    sources:
      - path: ChromaticOrder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ianhandy.kroma
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "33"
        # iPhone-only (family 1). iPad would require all four
        # orientations for multitasking, which would force a layout
        # rework — can revisit for a future iPad rev. Apple's upload
        # validator rejects the bundle if iPad is included with
        # portrait-only.
        #
        # This MUST live at the target level, not under the top-level
        # `settings.base`. xcodegen writes its own iOS platform default
        # ("1,2") at the target level, and a target-level value beats a
        # project-level one — so setting this project-wide silently did
        # nothing and shipped an iPad-enabled bundle (UIDeviceFamily
        # [1,2], iPad icon, all four orientations on a portrait-only
        # layout). Verify with:
        #   PlistBuddy -c "Print :UIDeviceFamily" <built app>/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: ChromaticOrder/ChromaticOrder.entitlements
    # Full Info.plist — driven by xcodegen instead of
    # GENERATE_INFOPLIST_FILE because UTExportedTypeDeclarations and
    # CFBundleDocumentTypes are nested arrays of dictionaries that
    # don't fit the flat INFOPLIST_KEY_* setting pattern. Custom UTI
    # (com.ianhandy.kroma.puzzle) registered here, app declared as its
    # owner/handler so tapping a .kroma file opens Kroma.
    info:
      path: ChromaticOrder/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: kromatika
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Base orientations list — all four, as Apple's validator
        # demands even on iPhone-only apps. The ~iphone variant
        # overrides at runtime so the app stays portrait-locked.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        # Pre-answer the "uses non-exempt encryption" question App
        # Store Connect asks on every upload. We don't ship crypto;
        # false here skips the prompt for all subsequent builds.
        ITSAppUsesNonExemptEncryption: false
        # Required for saving the solved-board snapshot to the Photos
        # library via PHPhotoLibrary.performChanges. The system shows
        # this string in the permission prompt the first time the
        # player taps "save image" on the solved overlay.
        NSPhotoLibraryAddUsageDescription: "Save your completed puzzle images to your Photos library."
        # Alternate app icons were removed outright (not deferred) —
        # the picker they fed was dead UI, since CFBundleAlternateIcons
        # was never re-registered after the SIGTERM-on-launch
        # diagnostic that pulled it. See commit 5e5b9e3. There is no
        # pending re-add; if alternate icons ever come back, do it via
        # asset-catalog sibling entries, not loose top-level PNGs.
        # We accept .kroma files for reading only (no in-place edits).
        # Silences the compile-time warning about file-open semantics.
        LSSupportsOpeningDocumentsInPlace: false
        # Custom document type — Kroma Puzzle (.kroma). Exports as a
        # subtype of public.json so any app that reads JSON can still
        # open one as text, but tapping a .kroma file offers "Open in
        # Kroma" because we own the UTI.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ianhandy.kroma.puzzle
            UTTypeDescription: Kroma Puzzle
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - kroma
              public.mime-type:
                - application/vnd.kroma.puzzle+json
        CFBundleDocumentTypes:
          - CFBundleTypeName: Kroma Puzzle
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.ianhandy.kroma.puzzle
            CFBundleTypeRole: Viewer
        # Custom URL scheme — `kroma://play?data=<base64-url-json>`
        # opens the app and loads the embedded puzzle. Lets a shared
        # link (in Messages, Slack, etc.) drop the recipient straight
        # into the puzzle without needing to tap through a file
        # attachment. Encoded inline so no server is required.
        CFBundleURLTypes:
          - CFBundleURLName: com.ianhandy.kroma.url
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - kroma
  # Logic-only tests, built for the Mac with no host app.
  #
  # The generator, solver and colour maths import no UIKit, so they compile
  # for macOS and can be tested without a simulator at all: no boot, no
  # install, no app launch, and no competing with anything else for the
  # device. That matters beyond speed. Simulator runs in this project have
  # failed preflight checks needing an uninstall, and one long audit was
  # silently invalidated when a reinstall replaced the test bundle mid-run,
  # because a hosted bundle lives inside the app it tests.
  #
  # Sources are compiled straight into the bundle rather than imported from
  # the app, which is what frees it from the host. Anything needing GameState,
  # SwiftUI views or the bundled campaign resource stays in ChromaticOrderTests.
  KromaLogicTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ChromaticOrder/Models/Puzzle.swift
      - path: ChromaticOrder/Core/OKLCh.swift
      - path: ChromaticOrder/Core/CBMode.swift
      - path: ChromaticOrder/Core/CBTransform.swift
      - path: ChromaticOrder/Core/Gradient.swift
      - path: ChromaticOrder/Core/Level.swift
      - path: ChromaticOrder/Core/LevelGeneratorRules.swift
      - path: ChromaticOrder/Core/Generate.swift
      - path: ChromaticOrder/Core/TargetedGenerate.swift
      - path: ChromaticOrder/Core/PuzzleSolver.swift
      - path: ChromaticOrder/Core/Proximity.swift
      - path: ChromaticOrder/Core/SeededRNG.swift
      - path: ChromaticOrder/Core/Util.swift
      - path: ChromaticOrder/Core/CreatorCodable.swift
      - path: ChromaticOrder/Core/StashedPuzzleStore.swift
      - path: ChromaticOrder/Core/ShapesSeenToday.swift
      - path: ChromaticOrder/Core/SolvedPuzzleHistory.swift
      - path: ChromaticOrder/Core/LikedPuzzleStore.swift
      - path: KromaLogicTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ianhandy.kroma.logictests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SUPPORTED_PLATFORMS: macosx
        CODE_SIGNING_ALLOWED: NO

  ChromaticOrderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChromaticOrderTests
    dependencies:
      - target: ChromaticOrder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ianhandy.kroma.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ChromaticOrder.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ChromaticOrder
schemes:
  KromaLogicTests:
    build:
      targets:
        KromaLogicTests: [test]
    test:
      config: Debug
      targets:
        - KromaLogicTests
  ChromaticOrder:
    build:
      targets:
        ChromaticOrder: all
        ChromaticOrderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChromaticOrderTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
